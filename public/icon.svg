<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#783F27" />
      <stop offset="50%" stop-color="#64321E" />
      <stop offset="100%" stop-color="#9C5234" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Square App Icon Surface -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" />

  <!-- Concentric Rings (DevAtlas Emblem) -->
  <g filter="url(#glow)">
    <!-- Outer concentric ring -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" />
    <!-- Inner solid focal core -->
    <circle cx="256" cy="256" r="64" fill="#FFFFFF" />
  </g>
</svg>
